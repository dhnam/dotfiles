# GNOME 설정 중 dotfiles로 관리하는 것만 모은 파일 (Linux 전용).
# 바뀌면 run_onchange_after_dconf-load.sh가 `dconf load /`로 적용한다. 여기 없는 키는 건드리지 않는다.
# 키 찾기: `dconf watch /`를 켜 둔 채 설정 앱에서 바꾸면 경로와 값이 나온다.

[org/gnome/shell]
enabled-extensions=['Battery-Health-Charging@maniacx.github.com', 'blur-my-shell@aunetx', 'clipboard-indicator@tudmotu.com', 'ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com', 'drive-menu@gnome-shell-extensions.gcampax.github.com', 'notification-banner@VitalyOstanin', 'notifications-follow-pointer@dhnam', 'secondary-monitor-clock@dhnam', 'screenshot-follows-pointer@dhnam']
favorite-apps=['org.gnome.Nautilus.desktop', 'zen.desktop', 'com.mitchellh.ghostty.desktop', 'com.anthropic.Claude.desktop', 'com.microsoft.VSCode.desktop', 'FFPWA-01M4YXVPM2JW0YQY4ZEHR7FMJX.desktop', 'FFPWA-01M4YYC1HT6BZBZXFAPZCP4TGQ.desktop', 'snap-store_snap-store.desktop']

# 시계에 초 표시 (위쪽 막대와 secondary-monitor-clock 확장이 같이 따른다),
# Ctrl을 한 번 눌렀다 떼면 마우스 위치 표시 (Windows의 Ctrl 위치 표시와 비슷)
[org/gnome/desktop/interface]
clock-show-seconds=true
locate-pointer=true

# Windows식 단축키: Win+Shift+S 스크린샷, 알림 목록은 Win+M (Win+V는 클립보드 기록)
[org/gnome/shell/keybindings]
show-screenshot-ui=['Print', '<Shift><Super>s']
toggle-message-tray=['<Super>m']

# Win+E 파일 관리자, Win+I 설정, Ctrl+Shift+Esc 시스템 모니터
[org/gnome/settings-daemon/plugins/media-keys]
control-center=['<Super>i']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']
home=['<Super>e']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Primary><Shift>Escape'
command='resources'
name='시스템 모니터 (Windows 작업 관리자)'

# 자동 절전과 화면 끄기 없음
[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='nothing'

[org/gnome/desktop/session]
idle-delay=uint32 0

# Ubuntu Dock: 패널 모드(화면 폭 전체), 모든 모니터, 모니터별 창, 클릭하면 앞으로/최소화, 패널 모드에서도 아이콘 가운데,
# 앱 표시 버튼은 왼쪽 끝 (오른쪽 끝은 보조 모니터 시계 자리) (Windows 작업 표시줄처럼)
[org/gnome/shell/extensions/dash-to-dock]
always-center-icons=true
click-action='focus-minimize-or-previews'
dash-max-icon-size=36
dock-fixed=true
dock-position='BOTTOM'
extend-height=true
isolate-monitors=true
isolate-workspaces=false
multi-monitor=true
show-apps-at-top=true
show-mounts=false
show-mounts-network=true
show-mounts-only-mounted=false
show-trash=true

# Blur my Shell: Ghostty 창 뒤만 흐리게 (Ghostty는 background-opacity = 0, 색은 파이프라인이 맡는다)
# applications는 'Windows Acrylic' 파이프라인: Windows Terminal의 Acrylic 구성
# (blur 30 -> Luminosity 블렌드 #202020 0.898 -> Color 블렌드 #1F1F1F 0.733 -> noise 0.04)
# pipelines는 확장 설정 화면에서 바꾼 뒤 dconf dump로 다시 옮긴다
[org/gnome/shell/extensions/blur-my-shell]
hacks-level=2
pipelines={'pipeline_default': {'name': <'Default'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_78938385592674'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.59999999999999998>}>}>]>}, 'pipeline_default_rounded': {'name': <'Default rounded'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000001'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.59999999999999998>}>}>]>}, 'pipeline_migrated_dynamic_blur': {'name': <'Migrated dynamic blur'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_migrated_dynamic_blur'>, 'params': <{'unscaled_radius': <60>, 'brightness': <0.59999999999999998>}>}>]>}, 'pipeline_migrated_dynamic_blur_2': {'name': <'Migrated dynamic blur 2'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_migrated_dynamic_blur'>, 'params': <{'unscaled_radius': <20>, 'brightness': <0.53000000000000003>}>}>]>}, 'pipeline_liquid_glass': {'name': <'Liquid Glass'>, 'effects': <[<{'type': <'luminosity'>, 'id': <'effect_liquid_glass_luminosity'>, 'params': <{'saturation_multiplicator': <1.1000000000000001>}>}>, <{'type': <'refraction'>, 'id': <'effect_liquid_glass_refraction'>, 'params': <{'tint': <0>}>}>, <{'type': <'noise'>, 'id': <'effect_liquid_glass_noise'>, 'params': <{'noise': <0.10000000000000001>}>}>]>}, 'pipeline_vapor_glass': {'name': <'Vapor Glass'>, 'effects': <[<{'type': <'luminosity'>, 'id': <'effect_vapor_glass_luminosity'>, 'params': <{'saturation_multiplicator': <1.1000000000000001>}>}>, <{'type': <'wave'>, 'id': <'effect_vapor_glass_wave'>, 'params': <@a{sv} {}>}>, <{'type': <'refraction'>, 'id': <'effect_vapor_glass_refraction'>, 'params': <{'tint': <0>}>}>, <{'type': <'noise'>, 'id': <'effect_vapor_glass_noise'>, 'params': <{'noise': <0.10000000000000001>}>}>]>}, 'pipeline_classic_light_background': {'name': <'Classic Light Background'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_classic_light_blur'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.59999999999999998>}>}>, <{'type': <'color'>, 'id': <'effect_classic_light_color'>, 'params': <{'color': <(1.0, 1.0, 1.0, 0.25)>, 'blend_mode': <17>}>}>]>}, 'pipeline_classic_dark_background': {'name': <'Classic Dark Background'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_classic_dark_blur'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.59999999999999998>}>}>, <{'type': <'color'>, 'id': <'effect_classic_dark_color'>, 'params': <{'color': <(0.40000000000000002, 0.40000000000000002, 0.40000000000000002, 0.34999999999999998)>, 'blend_mode': <17>}>}>]>}, 'pipeline_default_light': {'name': <'Default (Light mode)'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_default_light_blur'>, 'params': <{'unscaled_radius': <30>, 'brightness': <1>}>}>, <{'type': <'color'>, 'id': <'effect_default_light_color'>, 'params': <{'color': <(1.0, 1.0, 1.0, 0.5)>, 'blend_mode': <3>}>}>]>}, 'pipeline_9e7f1397-762f-43b6-ba9d-07d0e5752d9f': {'name': <'Windows Acrylic'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_15ec1124-3be5-41fa-ae72-5529b78f2f74'>, 'params': <{'unscaled_radius': <30>, 'brightness': <1>}>}>, <{'type': <'color'>, 'id': <'effect_acrylic_luminosity'>, 'params': <{'color': <(0.12549019607843137, 0.12549019607843137, 0.12549019607843137, 0.89800000000000002)>, 'blend_mode': <17>}>}>, <{'type': <'color'>, 'id': <'effect_94c43170-ba6f-466b-a3f2-47fa9cf1f577'>, 'params': <{'color': <(0.12156862745098039, 0.12156862745098039, 0.12156862745098039, 0.73299999999999998)>, 'blend_mode': <16>}>}>, <{'type': <'noise'>, 'id': <'effect_696ed596-dc91-4b59-9c10-65c72257ec47'>, 'params': <{'noise': <0.040000000000000001>, 'lightness': <0>}>}>]>}}
settings-version=10

[org/gnome/shell/extensions/blur-my-shell/appfolder]
pipeline='pipeline_migrated_dynamic_blur'

[org/gnome/shell/extensions/blur-my-shell/applications]
blur=true
blur-menus=false
blur-on-overview=false
brightness=0.53000000000000003
corner-radius=15
dynamic-opacity=false
enable-all=false
opacity=255
pipeline='pipeline_9e7f1397-762f-43b6-ba9d-07d0e5752d9f'
pipeline-dark='pipeline_default'
pipeline-light='pipeline_default_light'
rounded-corners=0
sigma=10
static-blur=false
unblur-when-fullscreen=false
whitelist=['com.mitchellh.ghostty']

[org/gnome/shell/extensions/blur-my-shell/coverflow-alt-tab]
pipeline='pipeline_default'

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
pipeline='pipeline_default_rounded'
pipeline-auto-mode=false
pipeline-dark='pipeline_default'
pipeline-light='pipeline_default_light'
static-blur=false
style-dash-to-dock=0
unblur-in-overview=false

[org/gnome/shell/extensions/blur-my-shell/lockscreen]
pipeline='pipeline_default'

[org/gnome/shell/extensions/blur-my-shell/overview]
pipeline='pipeline_default'

[org/gnome/shell/extensions/blur-my-shell/panel]
corner-radius=0
pipeline='pipeline_default'
static-blur=true

[org/gnome/shell/extensions/blur-my-shell/popup]
pipeline='pipeline_default_rounded'
screenshot-corner-radius=36

[org/gnome/shell/extensions/blur-my-shell/screenshot]
pipeline='pipeline_default'

[org/gnome/shell/extensions/blur-my-shell/window-list]
pipeline='pipeline_migrated_dynamic_blur'

# Clipboard Indicator: Win+V, 고르면 바로 붙여넣기
[org/gnome/shell/extensions/clipboard-indicator]
paste-on-select=true
toggle-menu=['<Super>v']

# 알림은 오른쪽 아래 (모니터는 notifications-follow-pointer 확장이 마우스 위치로 고른다)
[org/gnome/shell/extensions/notification-banner]
horizontal-position='right'
vertical-position='bottom'
