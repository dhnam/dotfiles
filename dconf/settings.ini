# GNOME 설정 중 dotfiles로 관리하는 것만 모은 파일 (Linux 전용).
# 바뀌면 run_onchange_after_dconf-load.sh가 `dconf load /`로 적용한다. 여기 없는 키는 건드리지 않는다.
# 키 찾기: `dconf watch /`를 켜 둔 채 설정 앱에서 바꾸면 경로와 값이 나온다.

[org/gnome/shell]
enabled-extensions=['Battery-Health-Charging@maniacx.github.com', 'blur-my-shell@aunetx', 'clipboard-indicator@tudmotu.com', 'ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com', 'drive-menu@gnome-shell-extensions.gcampax.github.com', 'notification-banner@VitalyOstanin', 'notifications-follow-pointer@dhnam', 'secondary-monitor-clock@dhnam']
favorite-apps=['org.gnome.Nautilus.desktop', 'zen.desktop', 'com.mitchellh.ghostty.desktop', 'com.anthropic.Claude.desktop', 'com.microsoft.VSCode.desktop', 'FFPWA-01M4YXVPM2JW0YQY4ZEHR7FMJX.desktop', 'FFPWA-01M4YYC1HT6BZBZXFAPZCP4TGQ.desktop', 'snap-store_snap-store.desktop']

# 시계에 초 표시 (위쪽 막대와 secondary-monitor-clock 확장이 같이 따른다)
[org/gnome/desktop/interface]
clock-show-seconds=true

# Windows식 단축키: Win+Shift+S 스크린샷, 알림 목록은 Win+M (Win+V는 클립보드 기록)
[org/gnome/shell/keybindings]
show-screenshot-ui=['Print', '<Shift><Super>s']
toggle-message-tray=['<Super>m']

# Win+E 파일 관리자, Win+I 설정, Ctrl+Shift+Esc 시스템 모니터
[org/gnome/settings-daemon/plugins/media-keys]
control-center=['<Super>i']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']
home=['<Super>e']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Primary><Shift>Escape'
command='resources'
name='시스템 모니터 (Windows 작업 관리자)'

# 자동 절전과 화면 끄기 없음
[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='nothing'

[org/gnome/desktop/session]
idle-delay=uint32 0

# Ubuntu Dock: 모든 모니터, 모니터별 창, 클릭하면 앞으로/최소화 (Windows 작업 표시줄처럼)
[org/gnome/shell/extensions/dash-to-dock]
click-action='focus-minimize-or-previews'
dash-max-icon-size=36
dock-position='BOTTOM'
extend-height=false
isolate-monitors=true
isolate-workspaces=false
multi-monitor=true
show-mounts=false
show-mounts-network=true
show-mounts-only-mounted=false
show-trash=true

# Blur my Shell: Ghostty 창 뒤만 흐리게 (Ghostty 쪽 background-opacity와 같이 쓴다)
[org/gnome/shell/extensions/blur-my-shell]
hacks-level=2

[org/gnome/shell/extensions/blur-my-shell/applications]
blur=true
blur-on-overview=false
brightness=0.53
corner-radius=15
dynamic-opacity=false
enable-all=false
opacity=255
sigma=10
static-blur=false
whitelist=['com.mitchellh.ghostty']

# Clipboard Indicator: Win+V, 고르면 바로 붙여넣기
[org/gnome/shell/extensions/clipboard-indicator]
paste-on-select=true
toggle-menu=['<Super>v']

# 알림은 오른쪽 아래 (모니터는 notifications-follow-pointer 확장이 마우스 위치로 고른다)
[org/gnome/shell/extensions/notification-banner]
horizontal-position='right'
vertical-position='bottom'
